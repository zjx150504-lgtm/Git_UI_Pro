name: Build Installers

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            script: dist:win
            artifact: windows-x64
          - name: Linux x64
            os: ubuntu-latest
            script: dist:linux
            artifact: linux-x64
          - name: macOS x64
            os: macos-15-intel
            script: dist:mac
            artifact: macos-x64
            mac_app_dir: mac
            mac_arch: x86_64
          - name: macOS arm64
            os: macos-15
            script: dist:mac
            artifact: macos-arm64
            mac_app_dir: mac-arm64
            mac_arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build non-macOS installer
        if: runner.os != 'macOS'
        run: npm run ${{ matrix.script }} -- --publish never

      - name: Build unsigned macOS installer
        if: runner.os == 'macOS'
        run: npm run ${{ matrix.script }} -- --publish never

      - name: Verify macOS installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          dmg_files=(release/*.dmg)
          zip_files=(release/*.zip)
          test "${#dmg_files[@]}" -eq 1
          test "${#zip_files[@]}" -eq 1
          test -f "${zip_files[0]}.blockmap"
          test -f release/latest-mac.yml
          hdiutil verify "${dmg_files[0]}"
          app_path="release/${{ matrix.mac_app_dir }}/Git UI Pro.app"
          file "$app_path/Contents/MacOS/Git UI Pro" | grep -q "${{ matrix.mac_arch }}"
          file "$app_path/Contents/Resources/app.asar.unpacked/node_modules/@homebridge/node-pty-prebuilt-multiarch/build/Release/pty.node" | grep -q "${{ matrix.mac_arch }}"

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: git-ui-pro-${{ matrix.artifact }}
          path: |
            release/Git-UI-Pro-Setup-*.exe
            release/Git-UI-Pro-Setup-*.exe.blockmap
            release/Git-UI-Pro-Portable-*.exe
            release/latest.yml
            release/*.AppImage
            release/*.deb
            release/*.dmg
            release/*.zip
            release/*.zip.blockmap
            release/latest-mac.yml
          if-no-files-found: error

  publish-github-release:
    name: Publish GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout publication scripts
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install publication dependencies
        run: npm ci --ignore-scripts

      - name: Download installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Merge macOS update metadata
        run: |
          node scripts/merge-mac-update-metadata.mjs \
            release-artifacts/git-ui-pro-macos-x64/latest-mac.yml \
            release-artifacts/git-ui-pro-macos-arm64/latest-mac.yml \
            release-artifacts/latest-mac.yml
          rm release-artifacts/git-ui-pro-macos-x64/latest-mac.yml
          rm release-artifacts/git-ui-pro-macos-arm64/latest-mac.yml

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-artifacts/**/*
